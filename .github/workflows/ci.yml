name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip and install build tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install package in editable mode with dev extras
        run: pip install -e ".[dev]"

      - name: Run syntax check
        run: |
          python -c "
          import ast, os, sys
          errors = []
          for dirpath, _, files in os.walk('uflask'):
              for f in files:
                  if not f.endswith('.py'): continue
                  path = os.path.join(dirpath, f)
                  try:
                      ast.parse(open(path).read(), filename=path)
                      print('  OK ', path)
                  except SyntaxError as e:
                      errors.append(e)
                      print('FAIL', path, e)
          sys.exit(len(errors))
          "

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run coverage
        run: pytest tests/ --cov=uflask --cov-report=xml --cov-report=term-missing

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check uflask/ --output-format=github

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip and install build tools
        run: python -m pip install --upgrade pip setuptools wheel build twine

      - name: Build package
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
