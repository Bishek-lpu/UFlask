site_name: uFlask
site_description: Flask-compatible micro web framework for MicroPython
site_url: https://uflask.readthedocs.io
repo_url: https://github.com/bishek/uflask
repo_name: bishek/uflask

theme:
  name: material
  palette:
    - scheme: slate
      primary: cyan
      accent: cyan
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.instant
    - content.code.copy

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - User Guide:
      - Routing: routing.md
      - Request Object: request.md
      - Response Helpers: response.md
      - Templates: templates.md
      - Middleware & Hooks: middleware.md
      - CORS: cors.md
      - Error Handling: exceptions.md
      - Blueprints: blueprints.md
      - Logging: logging.md
  - Changelog: ../CHANGELOG.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
