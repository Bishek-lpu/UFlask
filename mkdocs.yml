site_name: uFlask
site_description: Flask-compatible micro web framework for MicroPython / Raspberry Pi Pico W
site_url: https://uflask.readthedocs.io
repo_url: https://github.com/bishek/uflask
repo_name: bishek/uflask
copyright: Copyright &copy; 2026 Bishek – MIT License

theme:
  name: material
  palette:
    - scheme: slate
      primary: cyan
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: cyan
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/lightning-bolt
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quickstart.md
  - User Guide:
      - Routing: routing.md
      - Request Object: request.md
      - Response Helpers: response.md
      - Templates: templates.md
      - Blueprints: blueprints.md
      - Middleware & Hooks: middleware.md
      - CORS: cors.md
      - Error Handling: exceptions.md
      - Logging: logging.md
  - Deployment:
      - Pico W Deployment: deployment.md
  - Reference:
      - API Reference: api-reference.md
      - Changelog: changelog.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: On this page

plugins:
  - search:
      lang: en
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 3

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bishek/uflask
  version:
    provider: mike

extra_css:
  - css/extra.css
