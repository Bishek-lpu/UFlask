<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .logo {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .logo h1 { font-size: 1.8rem; color: #38bdf8; }
    .logo p  { color: #64748b; font-size: .85rem; margin-top: .25rem; }
    label {
      display: block;
      font-size: .85rem;
      color: #94a3b8;
      margin-bottom: .4rem;
      margin-top: 1rem;
    }
    input {
      width: 100%;
      padding: .6rem .9rem;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: #38bdf8; }
    .error {
      background: #450a0a;
      border: 1px solid #dc2626;
      color: #fca5a5;
      border-radius: 6px;
      padding: .6rem .9rem;
      margin-top: 1rem;
      font-size: .9rem;
    }
    button {
      margin-top: 1.5rem;
      width: 100%;
      padding: .7rem;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: #7dd3fc; }
    .hint { margin-top: 1rem; text-align: center; color: #64748b; font-size: .8rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>⚡ uFlask</h1>
      <p>Pico W Web Server</p>
    </div>
    <form method="POST" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" placeholder="admin" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="••••" autocomplete="current-password" required>
      {% if error %}
      <div class="error">⚠ {{ error }}</div>
      {% endif %}
      <button type="submit">Sign in →</button>
    </form>
    <p class="hint">Default: admin / pico</p>
  </div>
</body>
</html>
